name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check server.js
      - run: node --check public/app.js
      - run: node --check public/nest/util/parallel.js
      - run: node --check public/nest/svgnest.js
      - run: node --check public/nest/svgparser.js
      - run: node tests/offline-parallel-smoke.js

  offline-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependency
        run: python3 -m pip install --user websocket-client pillow
      - name: Run offline browser scenario
        run: python3 tests/offline-browser-smoke.py
